services:
  - type: web
    name: webhook-auto-api
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @webhook-auto/database build && pnpm --filter @webhook-auto/api build
    startCommand: npx prisma db push --schema=./packages/database/prisma/schema.prisma --accept-data-loss && node ./packages/database/prisma/seed.js && node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: webhook-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://webhook-auto-web.onrender.com
      - key: FRONTEND_URL
        value: https://webhook-auto-web.onrender.com
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

  - type: web
    name: webhook-auto-worker
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @webhook-auto/database build && pnpm --filter @webhook-auto/worker build
    startCommand: node apps/worker/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: webhook-redis
          property: connectionString
      - key: ENCRYPTION_MASTER_KEY
        fromService:
          type: web
          name: webhook-auto-api
          envVarKey: ENCRYPTION_MASTER_KEY

  - type: web
    name: webhook-auto-web
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @webhook-auto/web build
    startCommand: pnpm --filter @webhook-auto/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://webhook-auto-api.onrender.com

  - type: redis
    name: webhook-redis
    plan: free
    ipAllowList: []

databases:
  - name: webhook-postgres
    databaseName: webhook_db
    user: webhook_user
    plan: free
