services:
  - type: web
    name: webhook-auto-api
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @webhook-auto/database build && pnpm --filter @webhook-auto/api build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: webhook-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: webhook-auto-worker
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @webhook-auto/database build && pnpm --filter @webhook-auto/worker build
    startCommand: node apps/worker/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: webhook-redis
          property: connectionString

  - type: web
    name: webhook-auto-web
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @webhook-auto/web build
    startCommand: pnpm --filter @webhook-auto/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://webhook-auto-api.onrender.com

  - type: redis
    name: webhook-redis
    plan: free
    ipAllowList: []

databases:
  - name: webhook-postgres
    databaseName: webhook_db
    user: webhook_user
    plan: free
