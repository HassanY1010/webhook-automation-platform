services:
  # ---------------------------------------------------------------------------
  # 1. NestJS Backend API Service
  # ---------------------------------------------------------------------------
  - type: web
    name: webhook-auto-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @webhook-auto/database build && pnpm --filter @webhook-auto/api build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: key_value
          name: webhook-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://webhook-auto-web.onrender.com

  # ---------------------------------------------------------------------------
  # 2. BullMQ Worker Background Process
  # ---------------------------------------------------------------------------
  - type: worker
    name: webhook-auto-worker
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @webhook-auto/database build && pnpm --filter @webhook-auto/worker build
    startCommand: node apps/worker/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: key_value
          name: webhook-redis
          property: connectionString

  # ---------------------------------------------------------------------------
  # 3. Next.js Web Frontend Service
  # ---------------------------------------------------------------------------
  - type: web
    name: webhook-auto-web
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @webhook-auto/web build
    startCommand: pnpm --filter @webhook-auto/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://webhook-auto-api.onrender.com

# ---------------------------------------------------------------------------
# Databases & Key-Value Stores (PostgreSQL & Redis)
# ---------------------------------------------------------------------------
databases:
  - name: webhook-postgres
    databaseName: webhook_db
    user: webhook_user
    plan: free

keyValues:
  - name: webhook-redis
    plan: free
    ipAllowList: []
